name: Sync Google Drive family photos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: crafford-google-drive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install google-api-python-client google-auth pillow

      - name: Refresh main before sync
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Pull family photos from Google Drive
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_BATCH_SIZE: "40"
        run: python3 scripts/sync-google-drive.py

      - name: Commit new family photos
        id: commit
        run: |
          git config user.name "crafford-family-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/photos/google-drive js/google-drive-contributions.js data/google-drive-manifest.json
          if git diff --cached --quiet; then
            echo "No new or changed Google Drive photos."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Photos: sync family Google Drive"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub Pages rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
